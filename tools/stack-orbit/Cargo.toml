[package]
name = "stack-orbit"
version = "0.1.0"
edition = "2021"
description = "Generate an animated SVG map of GitHub repositories and shared languages"

[[bin]]
name = "stack-orbit"
path = "src/main.rs"

[dependencies]
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
