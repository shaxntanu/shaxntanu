name: Koi

on:
  schedule:
    - cron: "30 0,6,12,18 * * *" # 00:00, 06:00, 12:00, 18:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/koi.yml"
      - "tools/git-koi/**"

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Git Koi from the profile repo
        run: cargo build --release --locked --manifest-path tools/git-koi/Cargo.toml --target-dir "$RUNNER_TEMP/git-koi-target"
      - name: Collect and render the koi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/git-koi-target/release/git-koi" collect "$GITHUB_REPOSITORY_OWNER" --output "$RUNNER_TEMP/koi-snapshot.json"
          "$RUNNER_TEMP/git-koi-target/release/git-koi" render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body gold --utc-offset +05:30 --random-lap
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git pull --rebase --quiet origin main
          git push --quiet
