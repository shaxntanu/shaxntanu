name: Stack Orbit

on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stack-orbit.yml"
      - "tools/stack-orbit/**"

permissions:
  contents: write

concurrency:
  group: stack-orbit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the daily repository and language map
        run: cargo run --release --manifest-path tools/stack-orbit/Cargo.toml -- profile/stack-orbit.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_ORG: VIGIL-IoT
      - name: Commit the SVG if it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stack-orbit.svg
          if git diff --cached --quiet; then
            echo "Stack Orbit is unchanged."
            exit 0
          fi
          git commit --quiet --message "stack-orbit: refresh repository language map"
          git pull --rebase origin main
          git push origin HEAD:main
